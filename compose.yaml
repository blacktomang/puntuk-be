services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://puntuk:puntuk@db:5432/puntuk
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
      gunicorn config.asgi:application --bind 0.0.0.0:8000
      --worker-class uvicorn.workers.UvicornWorker --reload"
    volumes:
      - .:/app

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: puntuk
      POSTGRES_USER: puntuk
      POSTGRES_PASSWORD: puntuk
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puntuk -d puntuk"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
